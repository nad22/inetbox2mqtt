# Example Lovelace dashboard view for inetbox2mqtt
# Import via Settings -> Dashboards -> Edit Dashboard -> Raw configuration editor,
# or copy individual cards into an existing view.
#
# Adjust entity ids if you changed the MQTT topic prefix ("truma" by default).
title: Truma / Aventa
views:
  - title: Klimaanlage
    path: truma
    icon: mdi:air-conditioner
    cards:
      - type: thermostat
        entity: climate.truma_aventa

      - type: entities
        title: Verbindung
        entities:
          - entity: binary_sensor.truma_alive
            name: CPplus verbunden
          - entity: sensor.truma_release
            name: Firmware
          - entity: sensor.truma_clock
            name: CPplus Uhrzeit
          - entity: update.truma_firmware
            name: Firmware-Update

      - type: button
        entity: button.truma_reboot
        name: Gerät neu starten
        icon: mdi:restart
