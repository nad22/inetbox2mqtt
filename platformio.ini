; PlatformIO project configuration for inetbox2mqtt (C++ / ESP32 rewrite)
;
; Target board: any generic ESP32 Dev Kit (esp32dev)
; Framework:    Arduino core for ESP32
;
; See https://docs.platformio.org/en/latest/projectconf/index.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Increase upload speed for faster iteration (lower it if you get sync errors)
upload_speed = 921600

board_build.filesystem = littlefs
board_build.partitions = partitions.csv

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.1.0
    ESP32Async/ESPAsyncWebServer@^3.6.0
    ESP32Async/AsyncTCP@^3.3.2

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DASYNCWEBSERVER_REGEX=1

; -----------------------------------------------------------------------------
; Wiring (see doc/ELECTRIC.md):
;   TJA1020 LIN transceiver <-> ESP32 UART2
;     ESP32 TX2 (GPIO17) -> TJA1020 TXD
;     ESP32 RX2 (GPIO16) <- TJA1020 RXD
;   Common ground between ESP32, TJA1020 and vehicle LIN bus is mandatory.
; -----------------------------------------------------------------------------
